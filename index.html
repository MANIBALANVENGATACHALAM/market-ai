<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Market AI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #171b24;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .price-box,
        .chart,
        .analysis {
            background: #171b24;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .price-box {
            padding: 20px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
        }

        .chart {
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
        }

        #marketCanvas {
            width: 100%;
            height: 100%;
        }

        .analysis {
            padding: 20px;
        }

        .signal {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .info {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #292e38;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            margin-top: 15px;
        }

        .status {
            text-align: center;
            color: #888;
            margin-top: 10px;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>📊 Market AI</h1>

    <p>Live Market Analysis</p>

</div>


<div class="container">


    <select id="marketSelect">

        <option value="NIFTY 50">
            NIFTY 50
        </option>

        <option value="SENSEX">
            SENSEX
        </option>

    </select>


    <div class="price-box">

        <p>Current Price</p>

        <div class="price"
             id="currentPrice">
            --
        </div>

        <p>
            Live market data
        </p>

    </div>


    <div class="chart">

        <canvas id="marketCanvas"></canvas>

    </div>


    <div class="analysis">

        <h2>
            AI Market Analysis
        </h2>


        <div class="signal"
             id="trendSignal">

            ANALYSING...

        </div>


        <div class="info">

            <span>
                Direction
            </span>

            <strong id="direction">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                Current Price
            </span>

            <strong id="analysisPrice">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                Support
            </span>

            <strong id="support">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                Resistance
            </span>

            <strong id="resistance">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                RSI 14
            </span>

            <strong id="rsi">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                EMA 20
            </span>

            <strong id="ema20">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                EMA 50
            </span>

            <strong id="ema50">
                --
            </strong>

        </div>


        <div class="info">

            <span>
                Market Signal
            </span>

            <strong id="marketSignal">
                --
            </strong>

        </div>


        <button onclick="analyseMarket()">

            ANALYSE MARKET

        </button>


        <div class="status"
             id="status">

            Connecting to market...

        </div>


    </div>


</div>



<script>


/* =========================
   GOOGLE APPS SCRIPT API
   ========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzMiRK6wsYpqekr4WkW-eIOBgHded5-aN6i8cZ21p69Bt-gUj_1PAIbqhlUA9uYnRz0fw/exec";


/* =========================
   VARIABLES
   ========================= */

let prices = [];


const canvas =
    document.getElementById("marketCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================
   LOAD MARKET DATA
   ========================= */

async function loadMarketData() {

    try {

        document.getElementById("status")
            .textContent =
            "Loading market data...";


        const response =
            await fetch(API_URL);


        const data =
            await response.json();


        if (data.status !== "OK") {

            document.getElementById("status")
                .textContent =
                "Market data error";

            return;

        }


        /* =========================
           CURRENT PRICE
           ========================= */

        document.getElementById("currentPrice")
            .textContent =
            Number(data.price).toFixed(2);


        document.getElementById("analysisPrice")
            .textContent =
            Number(data.price).toFixed(2);


        /* =========================
           HISTORY
           ========================= */

        prices =
            data.history.map(function(item) {

                return Number(item.price);

            });


        /* =========================
           BACKEND ANALYSIS
           ========================= */

        if (data.analysis) {


            document.getElementById("trendSignal")
                .textContent =
                data.analysis.trend;


            document.getElementById("direction")
                .textContent =
                data.analysis.trend;


            document.getElementById("support")
                .textContent =
                Number(data.analysis.support)
                .toFixed(2);


            document.getElementById("resistance")
                .textContent =
                Number(data.analysis.resistance)
                .toFixed(2);


            document.getElementById("rsi")
                .textContent =
                Number(data.analysis.rsi14)
                .toFixed(2);


            document.getElementById("ema20")
                .textContent =
                Number(data.analysis.ema20)
                .toFixed(2);


            document.getElementById("ema50")
                .textContent =
                Number(data.analysis.ema50)
                .toFixed(2);


            document.getElementById("marketSignal")
                .textContent =
                data.analysis.signal;

        }


        /* =========================
           DRAW GRAPH
           ========================= */

        drawChart();


        document.getElementById("status")
            .textContent =
            "Market data updated";


        console.log(
            "Market data:",
            data
        );


    }

    catch (error) {

        console.log(
            "Market data error:",
            error
        );


        document.getElementById("status")
            .textContent =
            "Unable to connect to market data";

    }

}


/* =========================
   DRAW GRAPH
   ========================= */

function drawChart() {


    if (
        !prices ||
        prices.length === 0
    ) {

        return;

    }


    canvas.width =
        canvas.clientWidth *
        window.devicePixelRatio;


    canvas.height =
        canvas.clientHeight *
        window.devicePixelRatio;


    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const min =
        Math.min(...prices);


    const max =
        Math.max(...prices);


    const range =
        max - min || 1;


    ctx.beginPath();


    prices.forEach(
        function(price, i) {


            const x =
                (i /
                (prices.length - 1))
                * width;


            const y =
                height -
                (
                    (price - min)
                    / range
                )
                * (height - 30)
                - 15;


            if (i === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#00d084";


    ctx.lineWidth =
        3;


    ctx.stroke();

}


/* =========================
   ANALYSE BUTTON
   ========================= */

function analyseMarket() {

    document.getElementById("status")
        .textContent =
        "Refreshing analysis...";


    loadMarketData();

}


/* =========================
   AUTO REFRESH
   ========================= */

loadMarketData();


setInterval(
    loadMarketData,
    60000
);


/* =========================
   RESIZE GRAPH
   ========================= */

window.addEventListener(
    "resize",
    function() {

        drawChart();

    }
);


</script>


</body>

</html>
