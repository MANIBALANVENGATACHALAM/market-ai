<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #171b24;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .price-box,
        .chart,
        .analysis {
            background: #171b24;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .price-box {
            padding: 20px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
        }

        .chart {
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
        }

        #marketCanvas {
            width: 100%;
            height: 100%;
        }

        .analysis {
            padding: 20px;
        }

        .signal {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .info {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #292e38;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>📊 Market AI</h1>
    <p>Personal Market Analysis</p>
</div>

<div class="container">

    <select>
        <option>NIFTY 50</option>
        <option>SENSEX</option>
    </select>

    <div class="price-box">
        <p>Current Price</p>

        <div class="price">--</div>

        <p>Live market data</p>
    </div>

    <div class="chart">
        <canvas id="marketCanvas"></canvas>
    </div>

    <div class="analysis">

        <h2>AI Market Analysis</h2>

        <div class="signal" id="trendSignal">
            ANALYSING...
        </div>

        <div class="info">
            <span>Direction</span>
            <strong id="direction">--</strong>
        </div>

        <div class="info">
            <span>Current Price</span>
            <strong id="analysisPrice">--</strong>
        </div>

        <div class="info">
            <span>Support</span>
            <strong id="support">--</strong>
        </div>

        <div class="info">
            <span>Resistance</span>
            <strong id="resistance">--</strong>
        </div>

        <div class="info">
            <span>Market Signal</span>
            <strong id="marketSignal">--</strong>
        </div>

        <button onclick="analyseMarket()">
            ANALYSE MARKET
        </button>

    </div>

</div>


<script>

let prices = [];

const canvas = document.getElementById("marketCanvas");
const ctx = canvas.getContext("2d");

const API_URL =
"https://script.google.com/macros/s/AKfycbxBaiPC7wP-y4U3y_bfEpsfq2BlMmVi0yHa2r-PAQAY6eH07BArhib92Tcg06Z8Q28Zsw/exec";


async function loadMarketData() {

    try {

        const response = await fetch(API_URL);

        const data = await response.json();

        if (data.status !== "OK") {
            console.log("API error");
            return;
        }

        /* Current price */

        document.querySelector(".price").textContent =
            data.price.toFixed(2);


        /* Historical prices */

        prices = data.history.map(function(item) {
            return item.price;
        });


        /* Draw chart */

        drawChart();


        console.log("NIFTY 50:", data.price);

    }

    catch (error) {

        console.log("Market data error:", error);

    }

}


function drawChart() {

    if (!prices || prices.length === 0) {
        return;
    }


    canvas.width =
        canvas.clientWidth * devicePixelRatio;

    canvas.height =
        canvas.clientHeight * devicePixelRatio;


    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    const width = canvas.clientWidth;
    const height = canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const min =
        Math.min(...prices);

    const max =
        Math.max(...prices);


    ctx.beginPath();


    prices.forEach(function(price, i) {

        const x =
            (i / (prices.length - 1)) * width;


        const y =
            height -
            ((price - min) / (max - min)) *
            (height - 30) -
            15;


        if (i === 0) {

            ctx.moveTo(x, y);

        } else {

            ctx.lineTo(x, y);

        }

    });


    ctx.strokeStyle = "#00d084";

    ctx.lineWidth = 3;

    ctx.stroke();

}


/* MARKET ANALYSIS */

function analyseMarket() {

    if (!prices || prices.length < 10) {

        document.getElementById("trendSignal").textContent =
            "DATA NOT AVAILABLE";

        return;
    }


    const current =
        prices[prices.length - 1];


    const recent =
        prices.slice(-10);


    const previous =
        recent[0];


    const change =
        current - previous;


    const highest =
        Math.max(...recent);


    const lowest =
        Math.min(...recent);


    let direction;

    let signal;


    if (change > 0) {

        direction = "UP";

        signal = "WATCH FOR BUY";

    }

    else if (change < 0) {

        direction = "DOWN";

        signal = "WATCH FOR SELL";

    }

    else {

        direction = "SIDEWAYS";

        signal = "WAIT";

    }


    document.getElementById("trendSignal").textContent =
        direction;


    document.getElementById("direction").textContent =
        direction;


    document.getElementById("analysisPrice").textContent =
        current.toFixed(2);


    document.getElementById("support").textContent =
        lowest.toFixed(2);


    document.getElementById("resistance").textContent =
        highest.toFixed(2);


    document.getElementById("marketSignal").textContent =
        signal;

}


/* START */

loadMarketData();

</script>

</body>
</html>
